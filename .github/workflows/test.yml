name: Test

on:
  push:
    branches-ignore:
      - main

jobs:
  test:
    name: Run tests on all projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      - name: Setup Java
        uses: ./.github/actions/setup_java
        with:
          cache: gradle
      - run: ./gradlew test --no-daemon
