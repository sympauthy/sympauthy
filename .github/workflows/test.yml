# The static analysis and the unit tests, on every pull request and on `main` after a merge.
#
# `pull_request` is the trigger that matters. GitHub runs it against the merge of the branch with the
# base, so what is tested is the commit that becomes the trunk rather than the branch tip in
# isolation, and it fires in this repository for a branch pushed to a fork, where a `push` event
# would not. `push` is then narrowed to `main`: the same commit is no longer tested twice on a
# same-repo pull request, and a regression a merge introduces is visible on the merge rather than at
# the next release — the nightly runs against `main` but runs no unit tests. The cost is that a
# branch pushed with no pull request open is untested until the pull request exists. See #406.

name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  detekt:
    name: Analyse the sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup_gradle

      # detekt is wired to `check`, which this workflow does not reach, so it is named explicitly.
      # It is never run as `check`, which would pull the rest of the build in behind it.
      - run: ./gradlew detekt --no-daemon

      # Published even when the analysis failed, which is exactly when the findings are worth having
      # without opening the log. detekt writes its reports before it exits non-zero over findings,
      # but a failure that is not a finding — an unreadable rule set, a missing input — leaves no
      # report at all, so its absence is reported rather than failing this step over it.
      - name: Publish the findings to the run summary
        if: always()
        run: |
          report=server/build/reports/detekt/detekt.md
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "detekt produced no report — it failed before the analysis." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Run tests on all projects
    # The analysis costs seconds and needs no container, while the tests start PostgreSQL. There is
    # nothing to learn from running them against sources detekt has already rejected.
    needs: detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup_gradle
      - run: ./gradlew test --no-daemon
