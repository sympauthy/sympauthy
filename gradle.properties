# KSP reprocesses every source on every run, because an incremental run writes the aggregate outputs
# from the sources it reprocessed alone. micronaut-openapi rewrites the OpenAPI document from the
# controllers it was handed, so a method body changed in a manager drops the endpoints of every
# controller KSP did not reprocess, from the document the server publishes and the integration tests
# generate their client from. On the same run micronaut-inject-kotlin deletes the configuration
# metadata under META-INF. The first is reported upstream as
# https://github.com/micronaut-projects/micronaut-openapi/issues/2727: once it is fixed, this line
# goes if a run after a one-line change writes the tree a clean run does.
ksp.incremental=false
org.gradle.jvmargs=-Xmx2g -Xms512m
