# detekt rule set for SympAuthy.
#
# This file holds only the deviations from detekt's own default configuration; the task runs with
# --build-upon-default-config, so every rule not named here keeps its default state. detekt validates
# each key against the rules it knows, which means a rule renamed or removed by an upgrade fails the
# run rather than silently ceasing to apply.
#
# A rule is enabled here because detekt ships it off and these sources already obey it: it reports
# nothing on the tree as it stands, so it costs no cleanup and gates the first violation rather than
# judging the ones already written. That is the reason for every rule set to true below, which is why
# none of them carries one of its own. A rule detekt ships off that this codebase would violate is
# not enabled until the violations are gone, so no count ever has to be excused.
#
# A rule is disabled here because this codebase deliberately does the thing it forbids. That reason
# is particular to each one, so each carries a line saying it. Nothing is disabled to make a number
# go down.

comments:
  DeprecatedBlockTag:
    active: true
  EndOfSentenceFormat:
    active: true
  KDocReferencesNonPublicProperty:
    active: true
  OutdatedDocumentation:
    active: true

complexity:
  # A manager's constructor parameters are dependency injection, not an argument list anyone writes.
  LongParameterList:
    active: false
  # A size threshold is a taste call, deferred until one is argued for in
  # docs/standards/general-code-standard.md.
  LongMethod:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    active: false
  ComplexCondition:
    active: false
  NestedBlockDepth:
    active: false

exceptions:
  NotImplementedDeclaration:
    active: true
  ThrowingExceptionInMain:
    active: true
  # Every broad catch is a boundary converting a third-party failure into this server's own vocabulary.
  TooGenericExceptionCaught:
    active: false

# ktlint's rules, through detekt's formatting plugin. The plugin ships most of them on, and only the
# import order is a decision this codebase has taken: the order IntelliJ IDEA's Optimize imports
# writes with its default settings, spelled out so that an upgrade changing the rule's default cannot
# move it. Every other rule the plugin ships on is a choice about how the code looks that nobody has
# argued for yet, so each is switched off rather than adopted with the plugin. Turning one on is a
# change of its own.
formatting:
  ImportOrdering:
    active: true
    layout: '*,java.**,javax.**,kotlin.**,^'
  AnnotationOnSeparateLine:
    active: false
  AnnotationSpacing:
    active: false
  ArgumentListWrapping:
    active: false
  BlockCommentInitialStarAlignment:
    active: false
  ChainWrapping:
    active: false
  CommentSpacing:
    active: false
  CommentWrapping:
    active: false
  EnumEntryNameCase:
    active: false
  Filename:
    active: false
  FinalNewline:
    active: false
  FunKeywordSpacing:
    active: false
  FunctionReturnTypeSpacing:
    active: false
  FunctionStartOfBodySpacing:
    active: false
  FunctionTypeReferenceSpacing:
    active: false
  Indentation:
    active: false
  KdocWrapping:
    active: false
  MaximumLineLength:
    active: false
  ModifierListSpacing:
    active: false
  ModifierOrdering:
    active: false
  MultiLineIfElse:
    active: false
  NoBlankLineBeforeRbrace:
    active: false
  NoBlankLinesInChainedMethodCalls:
    active: false
  NoConsecutiveBlankLines:
    active: false
  NoEmptyClassBody:
    active: false
  NoEmptyFirstLineInMethodBlock:
    active: false
  NoLineBreakAfterElse:
    active: false
  NoLineBreakBeforeAssignment:
    active: false
  NoMultipleSpaces:
    active: false
  NoSemicolons:
    active: false
  NoTrailingSpaces:
    active: false
  NoUnitReturn:
    active: false
  NoUnusedImports:
    active: false
  NoWildcardImports:
    active: false
  NullableTypeSpacing:
    active: false
  PackageName:
    active: false
  ParameterListWrapping:
    active: false
  ParameterWrapping:
    active: false
  PropertyWrapping:
    active: false
  SpacingAroundAngleBrackets:
    active: false
  SpacingAroundColon:
    active: false
  SpacingAroundComma:
    active: false
  SpacingAroundCurly:
    active: false
  SpacingAroundDot:
    active: false
  SpacingAroundDoubleColon:
    active: false
  SpacingAroundKeyword:
    active: false
  SpacingAroundOperators:
    active: false
  SpacingAroundParens:
    active: false
  SpacingAroundRangeOperator:
    active: false
  SpacingAroundUnaryOperator:
    active: false
  SpacingBetweenDeclarationsWithAnnotations:
    active: false
  SpacingBetweenDeclarationsWithComments:
    active: false
  SpacingBetweenFunctionNameAndOpeningParenthesis:
    active: false
  StringTemplate:
    active: false
  UnnecessaryParenthesesBeforeTrailingLambda:
    active: false
  Wrapping:
    active: false

naming:
  LambdaParameterNaming:
    active: true
  VariableMaxLength:
    active: true
  # A file is named for the concept it holds, not for whichever declaration is its only class-like one.
  MatchingDeclarationName:
    active: false

performance:
  UnnecessaryPartOfBinaryExpression:
    active: true
  # Used only where a vararg is forwarded, and the copy it costs is not measurable at these sizes.
  SpreadOperator:
    active: false

potential-bugs:
  CastToNullableType:
    active: true
  MissingPackageDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true

style:
  AlsoCouldBeApply:
    active: true
  CascadingCallWrapping:
    active: true
  CollapsibleIfStatements:
    active: true
  DoubleNegativeLambda:
    active: true
  EqualsOnSignatureLine:
    active: true
  MandatoryBracesLoops:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  MultilineRawStringIndentation:
    active: true
  NoTabs:
    active: true
  OptionalUnit:
    active: true
  RedundantVisibilityModifierRule:
    active: true
  SpacingBetweenPackageAndImports:
    active: true
  StringShouldBeRawString:
    active: true
    # An OpenAPI description is an annotation argument, so it is a constant and cannot be trimmed; a
    # raw string would publish its indentation, and a list of error codes is lines joined by \n.
    ignoredCharacters: ['\n']
  TrailingWhitespace:
    active: true
  UnderscoresInNumericLiterals:
    active: true
  UnnecessaryBackticks:
    active: true
  UntilInsteadOfRangeTo:
    active: true
  UnusedImports:
    active: true
  # The tests import org.junit.jupiter.api.Assertions.* wholesale, as house style.
  WildcardImport:
    active: false
  # Guard clauses are the documented idiom, so several of each per function is expected. See
  # docs/standards/exception-code-standard.md.
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  # Left off with the size thresholds: which literals deserve a name has not been argued for either.
  MagicNumber:
    active: false
  # A parameter this codebase does not read is one it is not free to drop: a validator, a parser and a
  # controller each declare the signature their one caller invokes them through.
  UnusedParameter:
    active: false
  # @InjectMockKs fills a subject's constructor by reflection, so a property no test body names is
  # still what makes the subject buildable.
  UnusedPrivateProperty:
    excludes: ['**/test/**']
