# This configuration creates an admin client used by the admin UI application.
# End-users authenticating through it are granted admin scopes via a scope granting rule
# that evaluates the is_sympauthy_admin claim. The bootstrap invitation sets this claim
# to true for the first admin user.
#
# Activate this environment by adding "admin" to MICRONAUT_ENVIRONMENTS (e.g. "default,admin").

admin:
  enabled: true
  integrated-ui: true
  audience: admin

audiences:
  admin:
    sign-up-enabled: false
    invitation-enabled: true

claims:
  is_sympauthy_admin:
    # An application's: nobody types it, the bootstrap invitation below assigns it, and the granting
    # rule reads it. The template is what says so, and it carries the client scopes that read and
    # write a claim of that kind.
    template: application
    type: boolean
    audience: admin
  # What an operator chooses in the panel: the theme, the language, the date format, the time zone. On
  # the account rather than in the browser, so a choice made in one browser follows the operator to the
  # next; a deployment turning it off leaves the panel keeping them in the browser alone.
  sympauthy_admin_preferences:
    # The person's, because the operator chooses it in the panel and an application claim is never the
    # person's to write. `kind` rather than the `personal` template, whose places would put the panel's
    # document in every id token and `/userinfo` response the admin client is issued: naming no place
    # publishes it in none, and the panel reads it through the user API.
    kind: personal
    type: json
    # So that no application the same person signs in to reads or writes the panel's document.
    audience: admin
    # The document the panel writes takes a few hundred bytes. The 8 KiB default is room anybody holding
    # a bound token could fill with something other than preferences.
    max-size: 1024
    acl:
      # The panel's tokens are bound to a DPoP key already, so asking for one costs it nothing and leaves
      # a bearer token copied out of a browser nothing to read or overwrite.
      readable-by-person: TOKEN_IS_BOUND()
      writable-by-person: TOKEN_IS_BOUND()

clients:
  admin:
    audience: admin
    public: true
    allowed-grant-types:
      - authorization_code
      - refresh_token
    allowed-redirect-uris:
      - "${urls.root}/admin/callback"
      # Shipped so that the Authorize button of the documentation this server serves reaches the admin
      # scopes. Swagger UI takes no redirect URI from a build, and sends this one.
      - "${urls.root}/swagger-ui/oauth2-redirect.html"
    allowed-scopes:
      - openid
      - profile
      - admin:config:read
      - admin:users:read
      - admin:users:write
      - admin:users:delete
      - admin:consent:read
      - admin:consent:write
      - admin:invitations:read
      - admin:invitations:write
      - admin:grants:read
      - admin:grants:write
      - admin:interactive-flow-sessions:read
    default-scopes:
      - openid
      - profile
      - admin:config:read
      - admin:users:read
      - admin:users:write
      - admin:users:delete
      - admin:consent:read
      - admin:consent:write
      - admin:invitations:read
      - admin:invitations:write
      - admin:grants:read
      - admin:grants:write
      - admin:interactive-flow-sessions:read

rules:
  user:
    - scopes:
        - admin:config:read
        - admin:users:read
        - admin:users:write
        - admin:users:delete
        - admin:consent:read
        - admin:consent:write
        - admin:invitations:read
        - admin:invitations:write
        - admin:grants:read
        - admin:grants:write
        - admin:interactive-flow-sessions:read
      expressions:
        - 'CLAIM("is_sympauthy_admin") = "true"'

invitations:
  first-admin:
    audience: admin
    url-template: "${urls.root}/admin/register?invitation_token={token}"
    claims:
      is_sympauthy_admin: "true"
    note: Bootstrap invitation for the first admin user
