# This configuration creates an admin client used by the admin UI application.
# End-users authenticating through it are granted admin scopes via a scope granting rule
# that evaluates the is_sympauthy_admin claim. The bootstrap invitation sets this claim
# to true for the first admin user.
#
# Activate this environment by adding "admin" to MICRONAUT_ENVIRONMENTS (e.g. "default,admin").

admin:
  enabled: true
  integrated-ui: true
  audience: admin

audiences:
  admin:
    sign-up-enabled: false
    invitation-enabled: true

claims:
  is_sympauthy_admin:
    # An application's: nobody types it, the bootstrap invitation below assigns it, and the granting
    # rule reads it. The template is what says so, and it carries the client scopes that read and
    # write a claim of that kind.
    template: application
    type: boolean
    audience: admin
  # What an administrator chooses in the admin console: the theme, the language, the date format,
  # the time zone. On the account rather than in the browser, so a choice made in one browser
  # follows them to the next. A claim of its own rather than `locale` and `zoneinfo`, which are the
  # person's profile and published to every client the person consented `profile` to.
  sympauthy_admin_preferences:
    # The person's, because the administrator chooses it in the console and an application claim is
    # never the person's to write. `kind` rather than the `personal` template, whose places would
    # list the claim in the discovery document and carry it in `/userinfo`: the console reads it
    # through the user API, and no relying party has a use for it.
    kind: personal
    type: json
    # So that no application the same person signs in to reads or writes the console's document.
    audience: admin
    # The console's document holds a handful of short members, in a few hundred bytes. The 8 KiB
    # default is room anybody holding a bound token could fill with something other than
    # preferences.
    max-size: 1024
    acl:
      # The console's tokens are bound to a DPoP key already, so asking for one costs it nothing,
      # and a bearer token copied out of a browser neither reads nor writes the document through the
      # user API.
      readable-by-person: TOKEN_IS_BOUND()
      writable-by-person: TOKEN_IS_BOUND()

clients:
  admin:
    # What the confirmation page and the admin console call this client. The brand header beside it
    # already shows the deployment's own name, so the client's need not repeat it.
    display-name: Admin
    audience: admin
    public: true
    allowed-grant-types:
      - authorization_code
      - refresh_token
    allowed-redirect-uris:
      - "${urls.root}/admin/callback"
      # Shipped so that the Authorize button of the documentation this server serves reaches the admin
      # scopes. Swagger UI takes no redirect URI from a build, and sends this one.
      - "${urls.root}/swagger-ui/oauth2-redirect.html"
    allowed-scopes:
      - openid
      - profile
      - admin:config:read
      - admin:users:read
      - admin:users:write
      - admin:users:delete
      - admin:consent:read
      - admin:consent:write
      - admin:invitations:read
      - admin:invitations:write
      - admin:grants:read
      - admin:grants:write
      - admin:interactive-flow-sessions:read
    default-scopes:
      - openid
      - profile
      - admin:config:read
      - admin:users:read
      - admin:users:write
      - admin:users:delete
      - admin:consent:read
      - admin:consent:write
      - admin:invitations:read
      - admin:invitations:write
      - admin:grants:read
      - admin:grants:write
      - admin:interactive-flow-sessions:read

rules:
  user:
    - scopes:
        - admin:config:read
        - admin:users:read
        - admin:users:write
        - admin:users:delete
        - admin:consent:read
        - admin:consent:write
        - admin:invitations:read
        - admin:invitations:write
        - admin:grants:read
        - admin:grants:write
        - admin:interactive-flow-sessions:read
      expressions:
        - 'CLAIM("is_sympauthy_admin") = "true"'

invitations:
  first-admin:
    audience: admin
    url-template: "${urls.root}/admin/register?invitation_token={token}"
    claims:
      is_sympauthy_admin: "true"
    note: Bootstrap invitation for the first admin user
