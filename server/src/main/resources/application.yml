micronaut:
  application:
    name: sympauthy
    version: ${version}

  server:
    cors:
      enabled: false

  security:
    enabled: true
    redirect:
      enabled: false
    intercept-url-map:
      - pattern: /flow/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /admin/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        http-method: GET
        access:
          - isAnonymous()
      # Every method, so that a request none of their routes matches reaches the router and is refused
      # with the 405 or the 415 it is due, rather than turned away as unauthenticated.
      - pattern: /api/oauth2/token
        access:
          - isAnonymous()
      - pattern: /api/oauth2/introspect
        access:
          - isAnonymous()
      - pattern: /api/oauth2/revoke
        access:
          - isAnonymous()

  serde:
    serialization:
      inclusion: NON_NULL

  # Off because a self-hosted server may have no collector to send to, and one named nowhere would be degraded from
  # the first export.
  otel:
    enabled: false

  router:
    static-resources:
      flow-non-html:
        paths: classpath:sympauthy-flow
        mapping: /flow/*.ico
      flow-assets:
        paths: classpath:sympauthy-flow/assets
        mapping: /flow/assets/**
      admin-non-html:
        paths: classpath:sympauthy-admin
        mapping: /admin/*.ico
      admin-assets:
        paths: classpath:sympauthy-admin/assets
        mapping: /admin/assets/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

netty:
  default:
    allocator:
      max-order: 3

endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: anonymous
    disk-space:
      enabled: false
    jdbc:
      enabled: false
    # Off because the database is reported by its condition instead, which degrades /health rather than
    # answering 503, and publishes no exception to an anonymous caller.
    r2dbc:
      enabled: false

otel:
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  logs:
    exporter: otlp
  exporter:
    otlp:
      # The SDK's default is grpc, and the only sender the server ships speaks http/protobuf.
      protocol: http/protobuf
  metric:
    export:
      interval: 10000
  # A liveness probe every few seconds would otherwise be the most-traced route.
  exclusions:
    - /health.*

flyway:
  enabled: true
  datasources:
    default:
      enabled: true
      locations:
        - classpath:databases/postgresql
        - classpath:databases/h2

# Disable otherwise JavaMailConfiguration is created empty, which causes problems to detect if mails are in-fact enabled.
# As soon as it is enabled, it will cause the application to fail with the following message if the rest of the
# configuration is absent: JavaMail configuration does not contain any properties.
javamail:
  enabled: false
