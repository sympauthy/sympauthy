# Localized messages used in emails.
# All the key must be formatted in snake-cases as following: mail.<mail_template>.<usage>
# The <mail_template> must be replaced by the name of the FTL template without the extension (ex. validation_code.ftl -> validation_code)
# The <usage> explains what the message contains (ex. preview_text).
# Every message is interpolated with the mail model: {displayName} is always there, {code} and {expiryMinutes}
# where the mail carries them. A message carries no apostrophe, no exclamation mark and no emoji.
# A message names {displayName} only where the reader cannot see it otherwise: the subject, read in the inbox
# before the header is, and the reason line of the footer. The header shows it above every other message, so
# neither a sentence of the card nor the preview text, which the inbox shows beside the subject, repeats it,
# unless the sentence says something of the deployment itself, as never asking for a code does.

# The kit (kit.ftl): what every mail shares.
mail.kit.tagline=A simple, self-hosted and open source OAuth 2/OpenID authorization server.
# The word SympAuthy is linked to its site wherever the sentence puts it, and is never translated.
mail.kit.powered_by=Powered by SympAuthy.
mail.kit.link_fallback=If the button does not work, copy this address into your browser:

# Validation of an email address.
mail.validation_code.subject={code}: your validation code for {displayName}.
mail.validation_code.title=Verify your email address
mail.validation_code.preview_text=Enter this code to verify your email address.
mail.validation_code.intro=Enter this code on the sign-in page to verify your email address.
mail.validation_code.expiry=The code is valid for {expiryMinutes} min.
mail.validation_code.not_requested=If you did not ask for this code, ignore this email. Your email address is not verified without it.
mail.validation_code.reason=You received this email because this address was entered on {displayName}.

# Reset of a password.
mail.reset_password.subject={code}: your code to reset your password on {displayName}.
mail.reset_password.subject_link=Reset your password on {displayName}.
mail.reset_password.title=Reset your password
mail.reset_password.preview_text=Choose a new password for your account.
mail.reset_password.intro_code=A password reset was requested for the account of this email address. Enter this code on the sign-in page to choose a new password.
mail.reset_password.intro_link=A password reset was requested for the account of this email address. Choose a new password with the button below.
mail.reset_password.button=Choose a new password
mail.reset_password.expiry_code=The code is valid for {expiryMinutes} min.
mail.reset_password.expiry_link=The link is valid for {expiryMinutes} min.
mail.reset_password.never_share_code=Never share this code. {displayName} never asks for it by phone, email or chat.
mail.reset_password.never_share_link=Never forward this email. Anyone with the link can choose a new password for your account.
mail.reset_password.not_requested=If you did not ask to reset your password, ignore this email. Your password stays the same.
mail.reset_password.reason=You received this email because a password reset was requested for this address on {displayName}.
