# Localized messages used in emails, keyed mail.<mail_template>.<usage> as docs/standards/i18n-standard.md
# names a mail key.
# Every message is interpolated with the mail model: {displayName} is always there, {code}, {expiryMinutes} and the
# rest where the mail carries them. A message carries no exclamation mark and no emoji, and no apostrophe as
# docs/standards/i18n-standard.md says.
# docs/design/branding.md says where a message may name {displayName}.

# The kit (kit.ftl): what every mail shares.
mail.kit.tagline=A simple, self-hosted and open source OAuth 2/OpenID authorization server.
# The word SympAuthy is linked to its site wherever the sentence puts it, and is never translated.
mail.kit.powered_by=Powered by SympAuthy.
mail.kit.link_fallback=If the button does not work, copy this address into your browser:

# Validation of an email address.
mail.validation_code.subject={code}: your validation code for {displayName}.
mail.validation_code.title=Verify your email address
mail.validation_code.preview_text=Enter this code to verify your email address.
mail.validation_code.intro=Enter this code on the {displayName} sign-in page to verify your email address.
mail.validation_code.expiry=The code is valid for {expiryMinutes} min.
mail.validation_code.not_requested=If you did not ask for this code, ignore this email. Your email address is not verified without it.
mail.validation_code.reason=You received this email because this address was entered on {displayName}.

# The code proving a password reset.
mail.reset_password.subject={code}: your code to reset your password on {displayName}.
mail.reset_password.title=Reset your password
mail.reset_password.preview_text=Choose a new password for your account.
mail.reset_password.intro=A password reset was requested for the account of this email address. Enter this code on the sign-in page to choose a new password.
mail.reset_password.expiry=The code is valid for {expiryMinutes} min.
mail.reset_password.never_share=Never share this code. {displayName} never asks for it by phone, email or chat.
mail.reset_password.not_requested=If you did not ask to reset your password, ignore this email. Your password stays the same.
mail.reset_password.reason=You received this email because a password reset was requested for this address on {displayName}.

# The notice to an address no account uses, that a password reset sent no code.
mail.reset_password_no_account.subject=Your password reset request on {displayName}.
mail.reset_password_no_account.title=No account uses this address
mail.reset_password_no_account.preview_text=No account uses this email address, so no code was sent.
mail.reset_password_no_account.intro=A password reset was requested for this email address, but no account uses it. No code was sent.
mail.reset_password_no_account.other_address=Did you sign up with another email address? Go back to the sign-in page and reset your password with that one.
mail.reset_password_no_account.not_requested=If you did not ask to reset a password, ignore this email. Nothing was changed.
mail.reset_password_no_account.reason=You received this email because this address was entered to reset a password on {displayName}.

# The notice to an account holding no password, that a password reset has nothing to reset.
# {providers} is the names of the providers the account signs in with, joined with "or".
mail.reset_password_no_password.subject=Your password reset request on {displayName}.
mail.reset_password_no_password.title=Your account has no password
mail.reset_password_no_password.preview_text_providers=Your account signs in with {providers} and has no password.
mail.reset_password_no_password.preview_text_none=Your account has no password to reset.
mail.reset_password_no_password.intro_providers=A password reset was requested for the account of this email address. It signs in with {providers}, so it has no password to reset.
mail.reset_password_no_password.intro_none=A password reset was requested for the account of this email address. It has no password to reset.
mail.reset_password_no_password.sign_in=On the sign-in page, choose to continue with {providers}.
mail.reset_password_no_password.not_requested=If you did not ask to reset a password, ignore this email. Nothing was changed.
mail.reset_password_no_password.reason=You received this email because a password reset was requested for this address on {displayName}.

# The notice that a password reset changed the password. {changedAt} is when, written out in UTC.
mail.password_changed.subject=Your password on {displayName} was changed.
mail.password_changed.title=Your password was changed
mail.password_changed.preview_text=If you did not change it, secure your email account first.
mail.password_changed.intro=The password of the account of this email address was reset on {changedAt}. Your old password no longer works, and apps that signed in with it are signed out.
mail.password_changed.not_you=If you did not reset it, someone else may be reading this inbox. Secure your email account, then reset your password again from the sign-in page.
mail.password_changed.you=If you reset it yourself, there is nothing to do.
mail.password_changed.reason=You received this email because the password of the account of this address was changed on {displayName}.
