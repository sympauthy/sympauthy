      readable-by-person: SCOPE_IS_CONSENTED("profile")
      readable-by-client: SCOPE_IS_CONSENTED("profile")
  profile:
    template: personal
    enabled: "false"
    type: string
    acl:
      collected-in-flow: SCOPE_IS_CONSENTED("profile")
      readable-by-person: SCOPE_IS_CONSENTED("profile")
      readable-by-client: SCOPE_IS_CONSENTED("profile")
  picture:
    template: personal
    enabled: "false"
    type: string
    acl:
      collected-in-flow: SCOPE_IS_CONSENTED("profile")
      readable-by-person: SCOPE_IS_CONSENTED("profile")
      readable-by-client: SCOPE_IS_CONSENTED("profile")
  website:
    template: personal
