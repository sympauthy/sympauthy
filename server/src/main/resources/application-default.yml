    acl:
      collected-in-flow: SCOPE_IS_CONSENTED("phone")
      readable-by-person: SCOPE_IS_CONSENTED("phone")
      readable-by-client: SCOPE_IS_CONSENTED("phone")
  street_address:
    template: personal
    enabled: "false"
    type: string
    group: address
    acl:
      collected-in-flow: SCOPE_IS_CONSENTED("address")
      readable-by-person: SCOPE_IS_CONSENTED("address")
      readable-by-client: SCOPE_IS_CONSENTED("address")
  locality:
