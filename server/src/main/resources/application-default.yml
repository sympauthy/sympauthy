# This configuration contains a default configuration allowing to start SympAuthy with minimal
# additional configurations.
#
# Activate this environment by adding "default" to MICRONAUT_ENVIRONMENTS (e.g. "default,admin").

advanced:
  hash:
    block-size: 8
    cost-parameter: 16_384
    key-length: 32
    parallelization-parameter: 1
    salt-length: 256
  invitation:
    token-length: 32
    default-expiration: 7d
    max-expiration: 30d
    hash:
      block-size: 8
      cost-parameter: 16_384
      key-length: 32
      parallelization-parameter: 1
      salt-length: 256
  jwt:
    public-alg: es256
    access-alg: es256
    private-alg: hs256
  keys-generation-strategy: auto-increment
  pagination:
    default-size: 20
    max-size: 100
  security-context:
    known-user-retention: 180d
    # Empty because naming a proxy promises this server is only reachable through it, and no file
    # shipped with the server can make that promise on a deployment's behalf.
    geo:
      auto-detect: false
      providers: [ ]
  validation-code:
    length: 6
    resend-delay: 1m
    expiration: 10m
  webhooks:
    authorization:
      timeout: 5s

audiences:
  default: { }

auth:
  authorization-code:
    # A minute rather than the ten RFC 6749 §4.1.2 allows, because a client exchanges a code as soon
    # as the person is redirected back to it, and the rest would only serve a code that leaked.
    expiration: 1m
  interactive-flow:
    expiration: 30m
  user-merging-enabled: false
  token:
    access-expiration: 1h
    refresh-enabled: true
    refresh-expiration: 30d
    dpop-required: false

templates:
  claims:
    personal:
      kind: personal
      # The two channels where the claims OpenID Connect defines are expected, and the discovery
      # document that says they exist. Nothing is published unless a file says so — a claim naming no
      # place reaches none — so the set the specification defines names them here rather than being
      # defaulted into. Neither carrier is what the access token or the introspection response would
      # be: a claim named there travels on every request a resource server makes, which is a decision
      # no file shipped with the server takes on a deployment's behalf.
      published-in: [ id-token, userinfo, discovery ]
      # No door, because a door opens on a scope and this template names none: each claim opens its
      # own under the scope it belongs to. Nor a client write anywhere, since a claim of the person's
      # restricted to no audience may not have one and this template restricts none.
    application:
      kind: application
      acl:
        readable-by-client: SCOPE_IS_GRANTED("users:claims:read")
        writable-by-client: SCOPE_IS_GRANTED("users:claims:write")
  clients:
    default:
      audience: default
      default-scopes:
        - openid
        - profile
      allowed-grant-types:
        - authorization_code
        - refresh_token
        - client_credentials

# Every claim OpenID Connect defines, each disabled: a deployment turns on the ones its applications
# ask for rather than being served the whole set, and the scope the specification puts each under is
# what a person agrees to before one is collected or disclosed.
claims:
  name:
    template: personal
    enabled: "false"
    type: string
    group: identity
    acl:
      collected-in-flow: SCOPE_IS_CONSENTED("profile")
      readable-by-person: SCOPE_IS_CONSENTED("profile")
      readable-by-client: SCOPE_IS_CONSENTED("profile")
  given_name:
    template: personal
    enabled: "false"
    type: string
    group: identity
    acl:
      collected-in-flow: SCOPE_IS_CONSENTED("profile")
      readable-by-person: SCOPE_IS_CONSENTED("profile")
      readable-by-client: SCOPE_IS_CONSENTED("profile")
  family_name:
    template: personal
    enabled: "false"
    type: string
    group: identity
    acl:
      collected-in-flow: SCOPE_IS_CONSENTED("profile")
      readable-by-person: SCOPE_IS_CONSENTED("profile")
      readable-by-client: SCOPE_IS_CONSENTED("profile")
  middle_name:
    template: personal
    enabled: "false"
    type: string
    group: identity
    acl:
      collected-in-flow: SCOPE_IS_CONSENTED("profile")
      readable-by-person: SCOPE_IS_CONSENTED("profile")
      readable-by-client: SCOPE_IS_CONSENTED("profile")
  nickname:
    template: personal
    enabled: "false"
    type: string
    acl:
      collected-in-flow: SCOPE_IS_CONSENTED("profile")
      readable-by-person: SCOPE_IS_CONSENTED("profile")
      readable-by-client: SCOPE_IS_CONSENTED("profile")
  preferred_username:
