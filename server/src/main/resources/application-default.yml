# This configuration contains a default configuration allowing to start SympAuthy with minimal
# additional configurations.
#
# Activate this environment by adding "default" to MICRONAUT_ENVIRONMENTS (e.g. "default,admin").

advanced:
  hash:
    block-size: 8
    cost-parameter: 16_384
    key-length: 32
    parallelization-parameter: 1
    salt-length: 256
  invitation:
    token-length: 32
    default-expiration: 7d
    max-expiration: 30d
    hash:
      block-size: 8
      cost-parameter: 16_384
      key-length: 32
      parallelization-parameter: 1
      salt-length: 256
  jwt:
    public-alg: es256
    access-alg: es256
    private-alg: hs256
  keys-generation-strategy: auto-increment
  pagination:
    default-size: 20
    max-size: 100
  security-context:
    known-user-retention: 180d
    # Empty because naming a proxy promises this server is only reachable through it, and no file
    # shipped with the server can make that promise on a deployment's behalf.
    geo:
      auto-detect: false
      providers: [ ]
  validation-code:
    length: 6
    resend-delay: 1m
    expiration: 10m
  webhooks:
    authorization:
      timeout: 5s

audiences:
  default: { }

auth:
  authorization-code:
    expiration: 30m
  user-merging-enabled: false
  token:
    access-expiration: 1h
    refresh-enabled: true
    refresh-expiration: 30d
    dpop-required: false

templates:
  claims:
    personal:
      kind: personal
      # The two channels where the claims OpenID Connect defines are expected, and the discovery
      # document that says they exist. Nothing is published unless a file says so — a claim naming no
      # place reaches none — so the set the specification defines names them here rather than being
      # defaulted into. Neither carrier is what the access token or the introspection response would
      # be: a claim named there travels on every request a resource server makes, which is a decision
      # no file shipped with the server takes on a deployment's behalf.
      published-in: [ id-token, userinfo, discovery ]
      acl:
        readable-by-person-when-consented: "true"
        collected-in-flow-when-consented: "true"
        readable-by-client-when-consented: "true"
        # False because a claim of the person's restricted to no audience grants no client write at
        # all, and this template restricts none: a deployment restricting one of its own claims to an
        # audience turns this on there.
        writable-by-client-when-consented: "false"
    application:
      kind: application
      acl:
        readable-with-client-scopes-unconditionally:
          - "users:claims:read"
        writable-with-client-scopes-unconditionally:
          - "users:claims:write"
  clients:
    default:
      audience: default
      default-scopes:
        - openid
        - profile
      allowed-grant-types:
        - authorization_code
        - refresh_token
        - client_credentials

# Every claim OpenID Connect defines, each disabled: a deployment turns on the ones its applications
# ask for rather than being served the whole set, and the consent scope the specification puts each
# under is what a person agrees to before one is disclosed.
claims:
  name:
    template: personal
    enabled: "false"
    type: string
    group: identity
    acl:
      consent-scope: profile
  given_name:
    template: personal
    enabled: "false"
    type: string
    group: identity
    acl:
      consent-scope: profile
  family_name:
    template: personal
    enabled: "false"
    type: string
    group: identity
    acl:
      consent-scope: profile
  middle_name:
    template: personal
    enabled: "false"
    type: string
    group: identity
    acl:
      consent-scope: profile
  nickname:
    template: personal
    enabled: "false"
    type: string
    acl:
      consent-scope: profile
  preferred_username:
    template: personal
    enabled: "false"
    type: string
    acl:
      consent-scope: profile
  profile:
    template: personal
    enabled: "false"
    type: string
    acl:
      consent-scope: profile
  picture:
    template: personal
    enabled: "false"
    type: string
    acl:
      consent-scope: profile
  website:
    template: personal
    enabled: "false"
    type: string
    acl:
      consent-scope: profile
  email:
    template: personal
    enabled: "false"
    type: email
    verified-id: email_verified
    acl:
      consent-scope: email
  gender:
    template: personal
    enabled: "false"
    type: string
    acl:
      consent-scope: profile
  birth_date:
    template: personal
    enabled: "false"
    type: date
    acl:
      consent-scope: profile
  zoneinfo:
    template: personal
    enabled: "false"
    type: timezone
    acl:
      consent-scope: profile
  locale:
    template: personal
    enabled: "false"
    type: string
    acl:
      consent-scope: profile
  phone_number:
    template: personal
    enabled: "false"
    type: phone-number
    verified-id: phone_number_verified
    acl:
      consent-scope: phone
  street_address:
    template: personal
    enabled: "false"
    type: string
    group: address
    acl:
      consent-scope: address
  locality:
    template: personal
    enabled: "false"
    type: string
    group: address
    acl:
      consent-scope: address
  region:
    template: personal
    enabled: "false"
    type: string
    group: address
    acl:
      consent-scope: address
  postal_code:
    template: personal
    enabled: "false"
    type: string
    group: address
    acl:
      consent-scope: address
  country:
    template: personal
    enabled: "false"
    type: string
    group: address
    acl:
      consent-scope: address

cors:
  allowed-headers:
    - X-Requested-With # sent by a swagger-ui documenting its API against this server, from its own origin

mfa:
  required: false
  totp:
    enabled: false

features:
  allow-access-to-client-without-scope: false
  email-validation: false
  grant-unhandled-scopes: false
  print-details-in-error: false

ui:
  display-name: SympAuthy
