      readable-by-person: SCOPE_IS_CONSENTED("address")
      readable-by-client: SCOPE_IS_CONSENTED("address")

cors:
  allowed-headers:
    - X-Requested-With # sent by a swagger-ui documenting its API against this server, from its own origin

mfa:
  required: false
  totp:
    enabled: false

features:
  allow-access-to-client-without-scope: false
  email-validation: false
  grant-unhandled-scopes: false
  print-details-in-error: false

ui:
  display-name: SympAuthy
