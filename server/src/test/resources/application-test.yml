micronaut:
  server:
    port: 18080

  health:
    monitor:
      # Off because no context a test starts schedules anything: the monitor polls every health
      # indicator on a thread of its own, a minute into the run and every minute after.
      enabled: false

claims:
  email:
    enabled: true

auth:
  issuer: http://localhost:18080
  identifier-claims:
    - email

urls:
  root: http://localhost:18080

admin:
  enabled: true
  integrated-ui: true
  audience: admin

audiences:
  admin: { }
